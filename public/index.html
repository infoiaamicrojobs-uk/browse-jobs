<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browse Jobs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2300BFA5'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#00BFA5; --brand-d:#00A88F; --brand-dd:#00796B;
  --ink:#10312c; --muted:#5f736f; --line:#dfe8e6; --bg:#f6f9f8; --card:#ffffff; --soft:#eef3f2;
  --chip:#dff5f1; --chip-ink:#00695c; --danger:#d93636;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:0 20px}

/* Hero */
.hero{background:linear-gradient(135deg,var(--brand-dd) 0%,var(--brand) 100%);color:#fff;padding:44px 0 72px;border-radius:0 0 44px 44px}
.hero h1{margin:0 0 24px;font-size:clamp(34px,6vw,52px);line-height:1.05;letter-spacing:-.03em;font-weight:800}
.search{background:#fff;border-radius:24px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;box-shadow:0 18px 40px rgba(0,60,50,.25);color:var(--ink)}
.search input,.search select{background:var(--soft);border:0;border-radius:14px;padding:16px 18px;font-size:17px;outline:none}
.search input{flex:1 1 100%}
.search select{flex:1 1 180px;min-width:0}
.search input:focus,.search select:focus{box-shadow:0 0 0 2px var(--brand)}
.btn{border:0;border-radius:14px;padding:14px 20px;font-weight:700;font-size:16px;cursor:pointer;background:var(--brand);color:#fff;transition:background .15s,transform .05s}
.btn:hover{background:var(--brand-d)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:#fff;color:var(--danger);border:1px solid #f3c9c9}
.btn.danger:hover{background:#fdf1f1}
.btn.sm{padding:10px 16px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.6;cursor:default}

/* Toolbar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px;font-size:14px;color:var(--muted)}
.bar .sp{flex:1}
.bar .who{font-weight:600}
.link{background:none;border:0;padding:6px 10px;border-radius:10px;color:var(--brand-dd);font-weight:700;cursor:pointer}
.link:hover{background:var(--chip)}

.count{margin:26px 0 14px;font-weight:700;color:var(--muted)}

/* Cards */
.grid{display:grid;gap:18px;padding-bottom:60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 14px rgba(16,49,44,.05)}
.head{display:flex;gap:14px;align-items:flex-start}
.avatar{flex:none;width:54px;height:54px;border-radius:16px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
.card h3{margin:0;font-size:22px;line-height:1.2;letter-spacing:-.01em;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;color:var(--muted);font-size:15px}
.chip{background:var(--chip);color:var(--chip-ink);padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px}
.salary{color:var(--muted);font-size:15px}
.snippet{color:var(--muted);line-height:1.6;margin:0;font-size:16px;word-break:break-word}
.by{border-top:1px dashed var(--line);padding-top:12px;color:var(--muted);font-size:15px;word-break:break-word}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.cat{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer}
.cat:hover{background:var(--chip)}
.cat.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pin{display:inline-flex;align-items:center;gap:5px}
.pin svg{width:15px;height:15px;flex:none;color:var(--brand-dd)}
.by{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.stars{display:inline-flex;align-items:center;gap:2px;color:#f5b301;font-weight:700}
.stars svg{width:16px;height:16px}
.stars .off{color:#d6dedc}
.stars .num{margin-left:5px;color:var(--muted);font-size:14px}
.rate{display:flex;gap:4px;align-items:center}
.rate button{background:none;border:0;padding:2px;cursor:pointer;color:#d6dedc;line-height:0}
.rate button svg{width:30px;height:30px}
.rate button.on{color:#f5b301}
.rate .clr{font-size:13px;color:var(--muted);margin-left:8px;line-height:1.2;text-decoration:underline}
.sal{display:grid;grid-template-columns:130px 1fr;gap:8px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 0}
a.btn{text-decoration:none;display:inline-block}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(8,30,26,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:26px;width:100%;max-width:560px;padding:26px;margin:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal h2{margin:0 0 16px;font-size:24px;letter-spacing:-.01em}
.close{float:right;background:var(--soft);border:0;border-radius:12px;width:38px;height:38px;font-size:20px;cursor:pointer;line-height:1}
label.f{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
.in{width:100%;background:var(--soft);border:1px solid transparent;border-radius:14px;padding:13px 15px;font-size:16px;outline:none}
.in:focus{border-color:var(--brand);background:#fff}
textarea.in{min-height:140px;resize:vertical}
.row{display:grid;gap:12px}
@media(min-width:520px){.row{grid-template-columns:1fr 1fr}}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.err{color:var(--danger);font-weight:600;font-size:14px;margin-top:12px;min-height:18px}
.full{white-space:pre-wrap;line-height:1.7;color:#27413c;margin:16px 0;word-break:break-word}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;z-index:80;max-width:90vw}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>Find work. Find talent.</h1>
    <div class="search">
      <input id="q" type="search" placeholder="Search jobs" autocomplete="off">
      <select id="cat" aria-label="Category"></select>
      <button class="btn" id="post">Post a job</button>
    </div>
    <div class="bar" id="bar" hidden>
      <span class="who" id="who"></span>
      <span class="sp"></span>
      <button class="link" id="cm">Categories</button>
      <button class="link" id="bk">Download backup</button>
      <button class="link" id="rs">Restore backup</button>
      <button class="link" id="out">Sign out</button>
      <input type="file" id="file" accept="application/json,.json" hidden>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="cats" id="cats"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</main>

<script>
(function(){
'use strict';
var DEFAULT_CATS=['Web & IT','Design & Creative','Writing & Translation','Marketing','Video & Animation','Admin & Support','Other'];
var CATS=DEFAULT_CATS.slice();
var TYPES=['Full-time','Part-time','Contract','Freelance','Internship'];
var jobs=[], session=null, loadFailed=false;
try{ session=JSON.parse(localStorage.getItem('jb_session')||'null'); }catch(e){}

function $(id){return document.getElementById(id)}
function el(tag,props){
  var n=document.createElement(tag), kids=Array.prototype.slice.call(arguments,2);
  Object.keys(props||{}).forEach(function(k){
    var v=props[k];
    if(k==='class') n.className=v;
    else if(k.indexOf('on')===0) n.addEventListener(k.slice(2),v);
    else if(v===true) n.setAttribute(k,'');
    else if(v!==false&&v!=null) n.setAttribute(k,v);
  });
  (function add(list){list.forEach(function(c){
    if(c==null||c===false) return;
    if(Array.isArray(c)) return add(c);
    n.appendChild(c.nodeType?c:document.createTextNode(String(c)));
  })})(kids);
  return n;
}
function toast(msg){
  var t=el('div',{class:'toast'},msg); document.body.appendChild(t);
  setTimeout(function(){t.remove()},2800);
}

/* ---------- Helpers: icons, salary, rating ---------- */
var NS='http://www.w3.org/2000/svg';
function svg(path,fill){
  var s=document.createElementNS(NS,'svg'); s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('aria-hidden','true');
  var p=document.createElementNS(NS,'path'); p.setAttribute('d',path); p.setAttribute('fill',fill||'currentColor'); s.appendChild(p); return s;
}
var PIN='M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z';
var STAR='M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8 5.8 21.1 7 14.2 2 9.3l6.9-1z';
var SIGN={BDT:'\u09F3',USD:'$'};
function pinLoc(t){ return el('span',{class:'pin'},svg(PIN),t); }
function salaryText(j){
  if(!j.salary) return '';
  var amt=String(j.salary).trim(), cur=j.salaryCurrency;
  if(!cur){ // older jobs: guess from text
    if(/bdt|tk|taka|\u09F3|\u099F\u09BE\u0995\u09BE/i.test(amt)) cur='BDT';
    else if(/usd|dollar|\$/i.test(amt)) cur='USD';
  }
  if(!cur) return amt;
  amt=amt.replace(/bdt|tk\.?|taka|\u09F3|usd|dollars?|\$/ig,'').trim();
  return SIGN[cur]+' '+amt;
}
function starRow(n){
  n=Math.max(0,Math.min(5,Number(n)||0)); if(!n) return null;
  var w=el('span',{class:'stars',title:n+' out of 5','aria-label':'Rating '+n+' out of 5'});
  for(var i=1;i<=5;i++){ var s=svg(STAR); if(i>n) s.setAttribute('class','off'); w.appendChild(s); }
  w.appendChild(el('span',{class:'num'},n+'.0'));
  return w;
}
function ratePicker(initial){
  var val=Number(initial)||0, box=el('div',{class:'rate'}), btns=[];
  function paint(){ btns.forEach(function(b,i){ b.className=i<val?'on':''; }); clr.style.display=val?'':'none'; }
  for(var i=1;i<=5;i++)(function(n){
    var b=el('button',{type:'button','aria-label':n+' star',onclick:function(){val=n;paint();}},svg(STAR));
    btns.push(b); box.appendChild(b);
  })(i);
  var clr=el('button',{type:'button',class:'clr',onclick:function(){val=0;paint();}},'Clear');
  box.appendChild(clr); paint();
  box.getValue=function(){return val};
  return box;
}

/* ---------- API ---------- */
function api(path,opts){
  opts=opts||{};
  var h={'content-type':'application/json'};
  if(session&&session.token) h.authorization='Bearer '+session.token;
  return fetch(path,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined})
    .then(function(r){
      return r.json().catch(function(){return {}}).then(function(d){
        if(r.status===401&&session&&path!=='/api/login'){ signOut(true); }
        if(!r.ok) throw new Error(d.error||'Something went wrong. Please try again.');
        return d;
      });
    });
}
function loadJobs(){
  return loadCats().then(function(){ return api('/api/jobs'); })
    .then(function(d){jobs=d.jobs||[];loadFailed=false;render()},function(){loadFailed=true;render()});
}
function setCats(list){
  if(!Array.isArray(list)||!list.length) return;
  CATS=list; var sel=$('cat'), cur=sel.value; sel.textContent='';
  sel.appendChild(el('option',{value:''},'All categories'));
  CATS.forEach(function(c){ sel.appendChild(el('option',{value:c},c)); });
  sel.value=CATS.indexOf(cur)>-1?cur:'';
}
function loadCats(){
  return api('/api/categories').then(function(d){ setCats(d.categories); }).catch(function(){});
}

/* ---------- Session ---------- */
function setSession(s){
  session=s;
  if(s) localStorage.setItem('jb_session',JSON.stringify(s)); else localStorage.removeItem('jb_session');
  renderBar(); render();
}
function signOut(silent){ setSession(null); if(!silent) toast('Signed out'); }
function renderBar(){
  var bar=$('bar');
  if(session){ bar.hidden=false; $('who').textContent='Signed in as '+(session.role==='admin'?'Admin':'Manager'); $('rs').hidden=session.role!=='admin'; }
  else bar.hidden=true;
}

/* ---------- Modal ---------- */
function openModal(title,body){
  var ov=el('div',{class:'ov'});
  var m=el('div',{class:'modal',role:'dialog','aria-modal':'true'},
    el('button',{class:'close','aria-label':'Close',onclick:close},'\u00d7'),
    el('h2',null,title), body);
  ov.appendChild(m);
  ov.addEventListener('mousedown',function(e){ if(e.target===ov) close(); });
  function key(e){ if(e.key==='Escape') close(); }
  function close(){ ov.remove(); document.removeEventListener('keydown',key); document.body.style.overflow=''; }
  document.addEventListener('keydown',key);
  document.body.style.overflow='hidden';
  document.body.appendChild(ov);
  var first=m.querySelector('input,textarea,select'); if(first) first.focus();
  return close;
}

/* ---------- Sign in ---------- */
function openLogin(after){
  var u=el('input',{class:'in',type:'text',autocomplete:'username',required:true});
  var p=el('input',{class:'in',type:'password',autocomplete:'current-password',required:true});
  var err=el('div',{class:'err'});
  var btn=el('button',{class:'btn',type:'submit',style:'width:100%;margin-top:18px'},'Sign in');
  var close;
  var form=el('form',{onsubmit:function(e){
    e.preventDefault(); err.textContent=''; btn.disabled=true;
    api('/api/login',{method:'POST',body:{username:u.value.trim(),password:p.value}})
      .then(function(d){ setSession({token:d.token,role:d.role}); close(); if(after) after(); })
      .catch(function(x){ err.textContent=x.message; btn.disabled=false; });
  }},
    el('label',{class:'f'},'Username'),u,
    el('label',{class:'f'},'Password'),p,
    err,btn);
  close=openModal('Sign in',form);
}

/* ---------- Categories (add / delete) ---------- */
function openCategories(onDone){
  var inp=el('input',{class:'in',type:'text',maxlength:'40',placeholder:'New category name'});
  var err=el('div',{class:'err'}), listBox=el('div',{style:'margin-top:14px;display:flex;flex-direction:column;gap:8px'});
  function paint(){
    listBox.textContent='';
    CATS.forEach(function(c){
      var builtIn=DEFAULT_CATS.indexOf(c)>-1;
      listBox.appendChild(el('div',{style:'display:flex;align-items:center;gap:10px;justify-content:space-between'},
        el('span',{class:'chip'},c),
        builtIn?el('span',{class:'hint',style:'margin:0'},'Built-in'):
          el('button',{type:'button',class:'btn danger sm',onclick:function(){
            if(!confirm('Delete category "'+c+'"?')) return; err.textContent='';
            api('/api/categories?name='+encodeURIComponent(c),{method:'DELETE'})
              .then(function(d){ setCats(d.categories); paint(); render(); })
              .catch(function(x){ err.textContent=x.message; });
          }},'Delete')));
    });
  }
  function add(){
    var name=inp.value.trim(); if(!name) return; err.textContent='';
    api('/api/categories',{method:'POST',body:{name:name}})
      .then(function(d){ setCats(d.categories); inp.value=''; paint(); render(); toast('Category added'); if(onDone) onDone(name); })
      .catch(function(x){ err.textContent=x.message; });
  }
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); add(); } });
  var body=el('div',null,
    el('div',{style:'display:flex;gap:8px'},inp,el('button',{type:'button',class:'btn',onclick:add},'Add')),
    err,listBox);
  paint(); return openModal('Categories',body);
}

/* ---------- Job form (create / edit) ---------- */
function openForm(job){
  job=job||{};
  var f={
    title:el('input',{class:'in',type:'text',maxlength:'120',required:true,value:job.title||'',placeholder:'e.g. Senior Frontend Developer'}),
    category:el('select',{class:'in'},CATS.map(function(c){return el('option',{value:c,selected:c===job.category},c)})),
    type:el('select',{class:'in'},TYPES.map(function(c){return el('option',{value:c,selected:c===job.type},c)})),
    location:el('input',{class:'in',type:'text',maxlength:'80',value:job.location||'',placeholder:'e.g. Dhaka or Remote'}),
    salaryCurrency:el('select',{class:'in'},
      el('option',{value:'BDT',selected:(job.salaryCurrency||'BDT')==='BDT'},'\u09F3 Taka'),
      el('option',{value:'USD',selected:job.salaryCurrency==='USD'},'$ Dollar')),
    salary:el('input',{class:'in',type:'text',maxlength:'60',value:job.salary||'',placeholder:'e.g. 80,000 / month'}),
    description:el('textarea',{class:'in',maxlength:'5000',required:true,placeholder:'Describe the work, requirements and how to get started.'}),
    applyUrl:el('input',{class:'in',type:'url',maxlength:'500',value:job.applyUrl||'',placeholder:'https://forms.gle/...'}),
    company:el('input',{class:'in',type:'text',maxlength:'80',required:true,value:job.company||'',placeholder:'Company or author name'})
  };
  f.description.value=job.description||'';
  var rating=ratePicker(job.rating);
  if(job.id&&!job.salaryCurrency&&job.salary){ var g=salaryText(job); if(g.charAt(0)==='\u09F3') f.salaryCurrency.value='BDT'; else if(g.charAt(0)==='$') f.salaryCurrency.value='USD'; if(/^[\u09F3$] /.test(g)) f.salary.value=g.slice(2); }
  var err=el('div',{class:'err'});
  var btn=el('button',{class:'btn',type:'submit',style:'width:100%;margin-top:18px'},job.id?'Save changes':'Post job');
  var close;
  var form=el('form',{onsubmit:function(e){
    e.preventDefault(); err.textContent=''; btn.disabled=true;
    var body={};
    Object.keys(f).forEach(function(k){body[k]=f[k].value});
    body.rating=rating.getValue();
    api(job.id?'/api/jobs/'+encodeURIComponent(job.id):'/api/jobs',{method:job.id?'PUT':'POST',body:body})
      .then(function(){ close(); toast(job.id?'Job updated':'Job posted'); return loadJobs(); })
      .catch(function(x){ err.textContent=x.message; btn.disabled=false; });
  }},
    el('label',{class:'f'},'Job title'),f.title,
    el('div',{class:'row'},
      el('div',null,el('label',{class:'f'},'Category'),f.category,el('button',{type:'button',class:'link',style:'padding:4px 0;margin-top:4px',onclick:function(){
        openCategories(function(name){
          f.category.textContent=''; CATS.forEach(function(c){ f.category.appendChild(el('option',{value:c},c)); }); f.category.value=name;
        });
      }},'+ Add new category')),
      el('div',null,el('label',{class:'f'},'Job type'),f.type)),
    el('div',{class:'row'},
      el('div',null,el('label',{class:'f'},'Location'),f.location),
      el('div',null,el('label',{class:'f'},'Salary'),el('div',{class:'sal'},f.salaryCurrency,f.salary))),
    el('label',{class:'f'},'Description'),f.description,
    el('label',{class:'f'},'Apply link (Google Form link)'),f.applyUrl,
    el('div',{class:'hint'},'Paste your Google Form link. The Apply now button will open it.'),
    el('label',{class:'f'},'Company or author name'),f.company,
    el('label',{class:'f'},'Rating'),rating,
    err,btn);
  close=openModal(job.id?'Edit job':'Post a job',form);
}

/* ---------- Job details ---------- */
function applyBtn(j){
  return j.applyUrl?el('a',{class:'btn sm',href:j.applyUrl,target:'_blank',rel:'noopener noreferrer'},'Apply now'):null;
}
function metaRow(j){
  return el('div',{class:'meta'},
    el('span',{class:'chip'},j.category),
    el('span',null,j.type),
    j.location?pinLoc(j.location):null);
}
function openDetails(j){
  openModal(j.title,el('div',null,
    metaRow(j),
    j.salary?el('div',{class:'salary',style:'margin-top:10px'},salaryText(j)):null,
    el('div',{class:'full'},j.description),
    el('div',{class:'by'},el('span',null,j.company),starRow(j.rating)),
    el('div',{class:'actions',style:'margin-top:16px'},applyBtn(j))));
}

/* ---------- Render ---------- */
function snippet(t){ t=String(t).replace(/\s+/g,' ').trim(); return t.length>110?t.slice(0,110).trim()+'\u2026':t; }
function renderCats(){
  var box=$('cats'), cur=$('cat').value; box.textContent='';
  [''].concat(CATS).forEach(function(c){
    box.appendChild(el('button',{type:'button',class:'cat'+(c===cur?' on':''),onclick:function(){$('cat').value=c;render();}},c||'All'));
  });
}
function render(){
  renderCats();
  var q=$('q').value.trim().toLowerCase(), c=$('cat').value;
  var list=jobs.filter(function(j){
    if(c&&j.category!==c) return false;
    if(!q) return true;
    return (j.title+' '+j.company+' '+j.description+' '+j.location+' '+j.category).toLowerCase().indexOf(q)>-1;
  });
  $('count').textContent=loadFailed?'':list.length+(list.length===1?' job':' jobs');
  var g=$('grid'); g.textContent='';
  if(loadFailed){ g.appendChild(el('div',{class:'empty'},'Could not load jobs. Please refresh the page.')); return; }
  if(!list.length){ g.appendChild(el('div',{class:'empty'},'No jobs found.')); return; }
  list.forEach(function(j){
    g.appendChild(el('article',{class:'card'},
      el('div',{class:'head'},
        el('div',{class:'avatar'},(j.company||'?').trim().charAt(0).toUpperCase()),
        el('div',null,el('h3',null,j.title))),
      metaRow(j),
      j.salary?el('div',{class:'salary'},salaryText(j)):null,
      el('p',{class:'snippet'},snippet(j.description)),
      el('div',{class:'by'},el('span',null,j.company),starRow(j.rating)),
      el('div',{class:'actions'},
        el('button',{class:'btn ghost sm',onclick:function(){openDetails(j)}},'Read more'),
        applyBtn(j),
        session?el('button',{class:'btn ghost sm',onclick:function(){openForm(j)}},'Edit'):null,
        session?el('button',{class:'btn danger sm',onclick:function(){ del(j); }},'Delete'):null)));
  });
}
function del(j){
  if(!confirm('Delete "'+j.title+'"?')) return;
  api('/api/jobs/'+encodeURIComponent(j.id),{method:'DELETE'})
    .then(function(){ toast('Job deleted'); return loadJobs(); })
    .catch(function(x){ toast(x.message); });
}

/* ---------- Backup ---------- */
function downloadBackup(){
  fetch('/api/backup',{headers:{authorization:'Bearer '+session.token}})
    .then(function(r){ if(!r.ok) throw new Error('Backup failed. Please sign in again.'); return r.blob(); })
    .then(function(b){
      var a=document.createElement('a'), d=new Date().toISOString().slice(0,10);
      a.href=URL.createObjectURL(b); a.download='browse-jobs-backup-'+d+'.json';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
    }).catch(function(x){ toast(x.message); });
}
function restoreBackup(file){
  if(!file) return;
  var rd=new FileReader();
  rd.onload=function(){
    var data;
    try{ data=JSON.parse(rd.result); }catch(e){ toast('This file is not a valid backup.'); return; }
    if(!confirm('Restore this backup? All current jobs will be replaced.')) return;
    api('/api/backup',{method:'POST',body:data})
      .then(function(d){ toast('Restored '+d.count+(d.count===1?' job':' jobs')); return loadJobs(); })
      .catch(function(x){ toast(x.message); });
  };
  rd.readAsText(file);
}

/* ---------- Init ---------- */
setCats(CATS);
$('q').addEventListener('input',render);
$('cat').addEventListener('change',render);
$('post').addEventListener('click',function(){ session?openForm():openLogin(function(){openForm()}); });
$('out').addEventListener('click',function(){signOut()});
$('cm').addEventListener('click',function(){openCategories()});
$('bk').addEventListener('click',downloadBackup);
$('rs').addEventListener('click',function(){$('file').value='';$('file').click()});
$('file').addEventListener('change',function(){restoreBackup(this.files[0])});
renderBar(); loadJobs();
})();
</script>
